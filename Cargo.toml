[package]
name = "lassoink-capture-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Windows Direct WM_POINTER pen capture diagnostic for the owner-tested Ink ON setup, with Winit and explicit Wintab diagnostics"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.0", default-features = false }
unicode-normalization = "=0.1.25"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "png-format"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
