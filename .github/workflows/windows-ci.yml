name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  verify:
    name: Verify M5/M6 benchmark harness and default tests on Windows x64
    runs-on: windows-2025
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Check formatting
        shell: pwsh
        run: cargo +1.100.0 fmt --all -- --check

      - name: Run Clippy
        shell: pwsh
        run: cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        shell: pwsh
        run: cargo +1.100.0 test --locked --workspace

      - name: Build
        shell: pwsh
        run: cargo +1.100.0 build --locked --workspace

  native-ui:
    name: Guarded Windows and provider subprocess tests
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      LASSOINK_RUN_NATIVE_UI_TESTS: "1"
      LASSOINK_RUN_PROVIDER_MOCK_TESTS: "1"
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Run guarded native UI tests serially
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = "1.100.0"
          $env:RUSTC = "rustc"
          cargo +1.100.0 test --locked --workspace -- --include-ignored --test-threads=1

  raster-cpu-compatibility:
    name: Opt-in SenOCR full-precision CPU compatibility probe
    if: >-
      github.repository == 'Herzchens/LassoInk' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/raster-cpu-compatibility'
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 60
    concurrency:
      group: senocr-cpu-compatibility
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
    steps:
      - name: Guard hosted runner and explicit opt-in before checkout or network access
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
        run: |
          if ($env:EXPECTED_REPOSITORY -cne 'Herzchens/LassoInk') { throw 'Repository guard failed.' }
          if ($env:EXPECTED_EVENT -cne 'pull_request') { throw 'Pull request event is required.' }
          if ($env:CI -cne 'true' -or $env:GITHUB_ACTIONS -cne 'true') { throw 'Actions guard failed.' }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'Hosted Windows x64 guard failed.' }
          if ($env:LASSOINK_RUN_SENOCR_CPU_COMPAT -cne '1') { throw 'Explicit opt-in is required.' }
          if ($env:EXPECTED_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Exact head SHA is invalid.' }
          if ($env:EXPECTED_HEAD_REPOSITORY -cne 'Herzchens/LassoInk' -or $env:EXPECTED_HEAD_REF -cne 'test/raster-cpu-compatibility') { throw 'Pull request source guard failed.' }

      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Set up pinned Python x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
          check-latest: false

      - name: Install pinned CPU runtime
        shell: pwsh
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_NO_CACHE_DIR: '1'
        run: |
          python -m pip install --quiet --disable-pip-version-check --no-cache-dir --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPU PyTorch installation failed.' }
          python -m pip install --quiet --disable-pip-version-check --no-cache-dir --only-binary=:all: --index-url https://pypi.org/simple 'transformers==5.23.0' 'Pillow==13.0.0' 'Jinja2==3.1.6'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Transformers/Pillow/template installation failed.' }

      - name: Run compatibility-only synthetic CPU probe
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          TRANSFORMERS_VERBOSITY: error
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: python tests/fixtures/senocr_full_precision_cpu_compat.py
