name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  verify:
    name: Verify M5/M6 benchmark harness and default tests on Windows x64
    runs-on: windows-2025
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Check formatting
        shell: pwsh
        run: cargo +1.100.0 fmt --all -- --check

      - name: Run Clippy
        shell: pwsh
        run: cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        shell: pwsh
        run: cargo +1.100.0 test --locked --workspace

      - name: Build
        shell: pwsh
        run: cargo +1.100.0 build --locked --workspace

  native-ui:
    name: Guarded Windows and provider subprocess tests
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      LASSOINK_RUN_NATIVE_UI_TESTS: "1"
      LASSOINK_RUN_PROVIDER_MOCK_TESTS: "1"
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Run guarded native UI tests serially
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = "1.100.0"
          $env:RUSTC = "rustc"
          cargo +1.100.0 test --locked --workspace -- --include-ignored --test-threads=1 --skip senocr_full_precision_raster_worker_integrates_with_m4_parent

  raster-reference-protocol:
    name: Test stdlib Raster worker protocol helpers
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Set up pinned Python x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
          check-latest: false

      - name: Run stdlib protocol tests
        shell: pwsh
        run: python -m unittest discover -s tests -p test_raster_reference_protocol.py

  raster-cpu-compatibility:
    name: Guarded SenOCR CPU compatibility and M4 Raster worker E2E
    if: >-
      github.repository == 'Herzchens/LassoInk' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'feat/benchmark-fidelity' ||
       github.event.pull_request.head.ref == 'feat/benchmark-observability' ||
       github.event.pull_request.head.ref == 'feat/benchmark-resources')
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 60
    concurrency:
      group: senocr-cpu-compatibility
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
      LASSOINK_RUN_SENOCR_M4_E2E: '1'
    steps:
      - name: Guard hosted runner and explicit opt-in before checkout or network access
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
          LASSOINK_RUN_SENOCR_M4_E2E: '1'
        run: |
          if ($env:EXPECTED_REPOSITORY -cne 'Herzchens/LassoInk') { throw 'Repository guard failed.' }
          if ($env:EXPECTED_EVENT -cne 'pull_request') { throw 'Pull request event is required.' }
          if ($env:CI -cne 'true' -or $env:GITHUB_ACTIONS -cne 'true') { throw 'Actions guard failed.' }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'Hosted Windows x64 guard failed.' }
          if ($env:LASSOINK_RUN_SENOCR_CPU_COMPAT -cne '1') { throw 'Explicit opt-in is required.' }
          if ($env:LASSOINK_RUN_SENOCR_M4_E2E -cne '1') { throw 'Explicit M4 worker E2E opt-in is required.' }
          if ($env:EXPECTED_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Exact head SHA is invalid.' }
          $allowedHeadRefs = @('feat/benchmark-fidelity', 'feat/benchmark-observability', 'feat/benchmark-resources')
          if ($env:EXPECTED_HEAD_REPOSITORY -cne 'Herzchens/LassoInk' -or $env:EXPECTED_HEAD_REF -cnotin $allowedHeadRefs -or $env:GITHUB_HEAD_REF -cne $env:EXPECTED_HEAD_REF) { throw 'Pull request source guard failed.' }

      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LASSOINK_CHECKED_OUT_HEAD_SHA=$actual"

      - name: Verify the stable runtime profile payload before setup or network
        shell: pwsh
        env:
          EXPECTED_PROFILE_SHA256: '3d6150df16fc91bf032638d88a02d30be6877f5b4e62da5682fa601d0fe1ac1c'
        run: |
          $profileBytes = [IO.File]::ReadAllBytes('tests/fixtures/senocr_runtime_profile_v1.json')
          if ($profileBytes.Length -gt 65536) { throw 'Runtime profile exceeds its size cap.' }
          $payloadLength = $profileBytes.Length
          if ($payloadLength -gt 0 -and $profileBytes[$payloadLength - 1] -eq 10) {
            $payloadLength--
            if ($payloadLength -gt 0 -and $profileBytes[$payloadLength - 1] -eq 13) { $payloadLength-- }
          }
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actualProfileSha = ([BitConverter]::ToString($sha.ComputeHash($profileBytes, 0, $payloadLength))).Replace('-', '').ToLowerInvariant()
          } finally {
            $sha.Dispose()
          }
          if ($actualProfileSha -cne $env:EXPECTED_PROFILE_SHA256) { throw 'Runtime profile payload digest mismatch.' }

      - name: Set up pinned Python x64
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
          check-latest: false

      - name: Install the checked-in runtime closure into an isolated venv
        shell: pwsh
        env:
          BASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_NO_CACHE_DIR: '1'
        run: |
          $profile = Get-Content -LiteralPath tests/fixtures/senocr_runtime_profile_v1.json -Raw | ConvertFrom-Json
          if ($profile.schema_version -ne 1 -or $profile.distribution_count -ne 41 -or @($profile.installed_distribution_closure).Count -ne 41) { throw 'Checked-in runtime profile shape/count is invalid.' }
          if ($profile.python_version -cne '3.13.17' -or $profile.platform -cne 'windows-x64') { throw 'Checked-in runtime profile target is invalid.' }
          $expectedPins = @{ jinja2='3.1.6'; pillow='13.0.0'; torch='2.15.0+cpu'; transformers='5.23.0' }
          if (@($profile.root_pins).Count -ne $expectedPins.Count) { throw 'Checked-in root pin count is invalid.' }
          foreach ($pin in $profile.root_pins) {
            if (-not $expectedPins.ContainsKey($pin.name) -or $expectedPins[$pin.name] -cne $pin.version) { throw 'Checked-in runtime root pin is invalid.' }
          }
          $names = @{}
          foreach ($package in $profile.installed_distribution_closure) {
            if ($package.name -notmatch '^[a-z0-9][a-z0-9.-]*$' -or $package.version -notmatch '^[A-Za-z0-9][A-Za-z0-9.!+_-]*$' -or $names.ContainsKey($package.name)) { throw 'Checked-in distribution entry is invalid.' }
            $names[$package.name] = $true
          }
          foreach ($name in @('pip', 'setuptools', 'torch')) { if (-not $names.ContainsKey($name)) { throw 'Checked-in tool/runtime bootstrap package is missing.' } }
          $venv = Join-Path $env:RUNNER_TEMP 'lasso-senocr-runtime-profile-venv'
          & $env:BASE_PYTHON -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Isolated runtime venv setup failed.' }
          $venvPython = Join-Path $venv 'Scripts\python.exe'
          $bootstrapSpecs = @($profile.installed_distribution_closure | Where-Object { $_.name -in @('pip', 'setuptools') } | ForEach-Object { "$($_.name)==$($_.version)" })
          $torchSpec = @($profile.installed_distribution_closure | Where-Object { $_.name -ceq 'torch' } | ForEach-Object { "$($_.name)==$($_.version)" })
          $remainingSpecs = @($profile.installed_distribution_closure | Where-Object { $_.name -notin @('pip', 'setuptools', 'torch') } | ForEach-Object { "$($_.name)==$($_.version)" })
          if ($bootstrapSpecs.Count -ne 2 -or $torchSpec.Count -ne 1 -or $remainingSpecs.Count -ne 38) { throw 'Checked-in package groups are incomplete.' }
          & $venvPython -m pip install --quiet --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --index-url https://pypi.org/simple $bootstrapSpecs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pip/setuptools bootstrap installation failed.' }
          & $venvPython -m pip install --quiet --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu $torchSpec
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPU PyTorch installation failed.' }
          & $venvPython -m pip install --quiet --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --index-url https://pypi.org/simple $remainingSpecs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime closure installation failed.' }
          Add-Content -Path $env:GITHUB_ENV -Value "LASSOINK_SENOCR_PYTHON=$venvPython"

      - name: Run guarded PNG and absolute-path worker checks before model fetch
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LASSOINK_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LASSOINK_EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          LASSOINK_EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
          LASSOINK_RUN_SENOCR_M4_E2E: '1'
          LASSOINK_SENOCR_APNG_FIXTURE: '${{ runner.temp }}\senocr-apng-negative.png'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $venvPython = Join-Path $env:RUNNER_TEMP 'lasso-senocr-runtime-profile-venv\Scripts\python.exe'
          & $venvPython -m unittest discover -s tests -p test_raster_reference_protocol.py
          if ($LASTEXITCODE -ne 0) { throw 'Guarded PNG and absolute-path worker checks failed.' }

      - name: Run compatibility-only synthetic CPU probe
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LASSOINK_EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          LASSOINK_EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
          LASSOINK_RUN_SENOCR_M4_E2E: '1'
          LASSOINK_SENOCR_ASSET_ROOT: '${{ runner.temp }}\lasso-senocr-worker-assets'
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          TRANSFORMERS_VERBOSITY: error
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          $venvPython = Join-Path $env:RUNNER_TEMP 'lasso-senocr-runtime-profile-venv\Scripts\python.exe'
          & $venvPython tests/fixtures/senocr_full_precision_cpu_compat.py
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility-only synthetic CPU probe failed.' }

      - name: Install pinned Rust toolchain for the actual M4 parent test
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --target x86_64-pc-windows-msvc

      - name: Run guarded actual M4 parent and SenOCR Raster worker E2E
        shell: pwsh
        env:
          LASSOINK_RUN_PROVIDER_MOCK_TESTS: '1'
          LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
          LASSOINK_RUN_SENOCR_M4_E2E: '1'
          LASSOINK_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LASSOINK_EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          LASSOINK_EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_SENOCR_ASSET_ROOT: '${{ runner.temp }}\lasso-senocr-worker-assets'
          LASSOINK_SENOCR_E2E_SHARED_DIR: '${{ runner.temp }}\lasso-senocr-worker-e2e'
          LASSOINK_SENOCR_APNG_FIXTURE: '${{ runner.temp }}\senocr-apng-negative.png'
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          TRANSFORMERS_VERBOSITY: error
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: cargo +1.100.0 test --locked --workspace senocr_full_precision_raster_worker_integrates_with_m4_parent -- --ignored --test-threads=1

      - name: Remove model and test-only temporary files
        if: always()
        shell: pwsh
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          foreach ($name in @('lasso-senocr-worker-assets', 'lasso-senocr-worker-e2e', 'lasso-senocr-runtime-profile-venv')) {
            $target = [IO.Path]::GetFullPath((Join-Path $runnerTemp $name))
            if ([IO.Path]::GetDirectoryName($target) -cne $runnerTemp) { throw 'Temporary cleanup path escaped RUNNER_TEMP.' }
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
          $apngFixture = [IO.Path]::GetFullPath((Join-Path $runnerTemp 'senocr-apng-negative.png'))
          if ([IO.Path]::GetDirectoryName($apngFixture) -cne $runnerTemp) { throw 'APNG cleanup path escaped RUNNER_TEMP.' }
          if (Test-Path -LiteralPath $apngFixture) { Remove-Item -LiteralPath $apngFixture -Force }
