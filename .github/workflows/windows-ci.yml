name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lock-resolution:
    name: Resolve temporary M5/M6 lockfile on Windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/m5-m6-benchmark-harness'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Confirm exact base Cargo.lock seed
        id: lock-seed
        shell: pwsh
        run: |
          $expectedBaseLock = "e44e07c01a696826ddb5ee73c7e3065d10dd247e"
          $headLock = (git rev-parse HEAD:Cargo.lock).Trim()
          $worktreeLock = (git hash-object --path=Cargo.lock Cargo.lock).Trim()
          if ($headLock -ne $expectedBaseLock -or $worktreeLock -ne $expectedBaseLock) {
            "should_resolve=false" >> $env:GITHUB_OUTPUT
            Write-Output "Head is past the lock-prep boundary; no lock-resolution artifact is needed."
          } else {
            "should_resolve=true" >> $env:GITHUB_OUTPUT
          }

      - name: Install pinned Rust toolchain
        if: steps.lock-seed.outputs.should_resolve == 'true'
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --target x86_64-pc-windows-msvc

      - name: Resolve lock in an ephemeral workspace
        if: steps.lock-seed.outputs.should_resolve == 'true'
        shell: pwsh
        run: |
          $resolutionRoot = Join-Path $env:RUNNER_TEMP "lassoink-lock-resolution-$env:GITHUB_RUN_ID"
          $resolutionSource = Join-Path $resolutionRoot "src"
          New-Item -ItemType Directory -Path $resolutionSource | Out-Null
          Copy-Item -LiteralPath ".github/lock-resolution/Cargo.toml.template" -Destination (Join-Path $resolutionRoot "Cargo.toml")
          Copy-Item -LiteralPath "Cargo.lock" -Destination (Join-Path $resolutionRoot "Cargo.lock")
          [System.IO.File]::WriteAllText((Join-Path $resolutionSource "main.rs"), "fn main() {}", [System.Text.UTF8Encoding]::new($false))
          $env:RUSTUP_TOOLCHAIN = "1.100.0"
          $env:RUSTC = "rustc"
          & cargo +1.100.0 metadata --manifest-path (Join-Path $resolutionRoot "Cargo.toml") --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Temporary lock resolution failed with exit $LASTEXITCODE" }
          $resolvedLock = Join-Path $resolutionRoot "Cargo.lock"
          if (-not (Test-Path -LiteralPath $resolvedLock)) { throw "Temporary resolver did not produce Cargo.lock" }
          $lockInfo = Get-Item -LiteralPath $resolvedLock
          if ($lockInfo.Length -le 0 -or $lockInfo.Length -gt 5MB) { throw "Resolved Cargo.lock is empty or exceeds 5 MiB" }
          function Get-LockPackageIdentities($lockPath) {
            $lockText = [System.IO.File]::ReadAllText($lockPath)
            $blocks = [regex]::Split($lockText, '(?m)(?=^\[\[package\]\]\s*$)')
            $identities = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            foreach ($block in $blocks) {
              $name = [regex]::Match($block, '(?m)^name = "([^"]+)"$')
              $version = [regex]::Match($block, '(?m)^version = "([^"]+)"$')
              $source = [regex]::Match($block, '(?m)^source = "([^"]+)"$')
              if ($name.Success -and $version.Success) {
                $sourceValue = if ($source.Success) { $source.Groups[1].Value } else { "local" }
                [void]$identities.Add("$($name.Groups[1].Value)|$($version.Groups[1].Value)|$sourceValue")
              }
            }
            return ,$identities
          }
          $baseIdentities = Get-LockPackageIdentities (Join-Path $env:GITHUB_WORKSPACE "Cargo.lock")
          $resolvedIdentities = Get-LockPackageIdentities $resolvedLock
          $removedIdentities = @()
          foreach ($identity in $baseIdentities) {
            if (-not $resolvedIdentities.Contains($identity)) { $removedIdentities += $identity }
          }
          if ($removedIdentities.Count -gt 0) {
            throw "Temporary resolution removed/replaced base package identities; review required: $($removedIdentities -join ', ')"
          }
          Write-Output "Diff of resolved Cargo.lock against the exact base lock (review additions; existing package identities are retained):"
          & git --no-pager diff --no-index --no-color --unified=3 -- (Join-Path $env:GITHUB_WORKSPACE "Cargo.lock") $resolvedLock
          $diffExit = $LASTEXITCODE
          if ($diffExit -gt 1) { throw "Could not compare resolved Cargo.lock against base (exit $diffExit)" }
          $artifactLock = Join-Path $env:RUNNER_TEMP "lassoink-m5-m6-Cargo.lock"
          if (Test-Path -LiteralPath $artifactLock) { throw "Lock artifact path unexpectedly already exists" }
          Copy-Item -LiteralPath $resolvedLock -Destination $artifactLock

      - name: Upload only the resolved lockfile
        if: steps.lock-seed.outputs.should_resolve == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lassoink-m5-m6-Cargo-lock-${{ github.sha }}
          path: ${{ runner.temp }}\lassoink-m5-m6-Cargo.lock
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify M5/M6 benchmark harness and default tests on Windows x64
    runs-on: windows-2025
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Check formatting
        shell: pwsh
        run: cargo +1.100.0 fmt --all -- --check

      - name: Run Clippy
        shell: pwsh
        run: cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        shell: pwsh
        run: cargo +1.100.0 test --locked --workspace

      - name: Build
        shell: pwsh
        run: cargo +1.100.0 build --locked --workspace

  native-ui:
    name: Guarded Windows and provider subprocess tests
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      LASSOINK_RUN_NATIVE_UI_TESTS: "1"
      LASSOINK_RUN_PROVIDER_MOCK_TESTS: "1"
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Run guarded native UI tests serially
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = "1.100.0"
          $env:RUSTC = "rustc"
          cargo +1.100.0 test --locked --workspace -- --include-ignored --test-threads=1
