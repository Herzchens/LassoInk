name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  canonical-raster-pixmap-smoke:
    name: Resolve and smoke-test temporary tiny-skia PNG path
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/canonical-raster-spec'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Guard hosted runner, repository, branch, and exact head before checkout
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          if ($env:EXPECTED_REPOSITORY -cne 'Herzchens/LassoInk') { throw 'Repository guard failed.' }
          if ($env:EXPECTED_EVENT -cne 'push' -or $env:EXPECTED_REF -cne 'refs/heads/feat/canonical-raster-spec') { throw 'Feature branch push is required.' }
          if ($env:CI -cne 'true' -or $env:GITHUB_ACTIONS -cne 'true') { throw 'Actions guard failed.' }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'Hosted Windows x64 guard failed.' }
          if ($env:EXPECTED_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Exact head SHA is invalid.' }

      - name: Check out exact pushed commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out head and exact baseline lock
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_HEAD_SHA) { throw "Expected $env:EXPECTED_HEAD_SHA; got $actual" }
          $expectedBaseLock = '03dc4003d8d2a954d1333b86d9e7710dfa611eaa'
          $headLock = (git rev-parse HEAD:Cargo.lock).Trim()
          $worktreeLock = (git hash-object --path=Cargo.lock Cargo.lock).Trim()
          if ($headLock -cne $expectedBaseLock -or $worktreeLock -cne $expectedBaseLock) {
            throw 'This probe requires the unchanged b9 Cargo.lock baseline.'
          }

      - name: Install pinned Rust 1.100.0
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --target x86_64-pc-windows-msvc

      - name: Resolve, compile, and run the temporary Pixmap PNG smoke
        shell: pwsh
        run: |
          $resolutionRoot = Join-Path $env:RUNNER_TEMP "lassoink-canonical-raster-$env:GITHUB_RUN_ID"
          $resolutionSource = Join-Path $resolutionRoot 'src'
          New-Item -ItemType Directory -Path $resolutionSource | Out-Null
          $manifestPath = Join-Path $resolutionRoot 'Cargo.toml'
          Copy-Item -LiteralPath '.github/canonical-raster/Cargo.toml.template' -Destination $manifestPath
          Copy-Item -LiteralPath 'Cargo.lock' -Destination (Join-Path $resolutionRoot 'Cargo.lock')
          $smokeSource = @'
          use tiny_skia::{Color, Pixmap};

          fn main() {
              let mut pixmap = Pixmap::new(16, 16).expect("bounded Pixmap allocation");
              pixmap.fill(Color::from_rgba8(255, 255, 255, 255));
              if pixmap.data().len() != 16 * 16 * 4 {
                  panic!("Pixmap RGBA layout length mismatch");
              }
              let encoded = pixmap.encode_png().expect("png-format encoding");
              if encoded.len() < 8 || encoded.len() > 65_536 || !encoded.starts_with(b"\x89PNG\r\n\x1a\n") {
                  panic!("bounded Pixmap PNG signature/length check failed");
              }
              println!("tiny-skia Pixmap/PNG smoke passed; encoded byte count={}", encoded.len());
          }
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $resolutionSource 'main.rs'),
            $smokeSource,
            [System.Text.UTF8Encoding]::new($false)
          )
          $env:RUSTUP_TOOLCHAIN = '1.100.0'
          $env:RUSTC = 'rustc'
          & cargo +1.100.0 metadata --manifest-path $manifestPath --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Temporary lock resolution failed with exit $LASTEXITCODE" }
          $resolvedLock = Join-Path $resolutionRoot 'Cargo.lock'
          if (-not (Test-Path -LiteralPath $resolvedLock)) { throw 'Temporary resolver did not produce Cargo.lock.' }
          $lockInfo = Get-Item -LiteralPath $resolvedLock
          if ($lockInfo.Length -le 0 -or $lockInfo.Length -gt 5MB) { throw 'Resolved Cargo.lock is empty or exceeds 5 MiB.' }
          $lockText = [System.IO.File]::ReadAllText($resolvedLock)
          foreach ($required in @('name = "tiny-skia"', 'version = "0.12.0"', 'name = "png"', 'version = "0.18.1"')) {
            if (-not $lockText.Contains($required)) { throw "Resolved lock is missing required package evidence: $required" }
          }
          function Get-LockPackageIdentities($lockPath) {
            $text = [System.IO.File]::ReadAllText($lockPath)
            $blocks = [regex]::Split($text, '(?m)(?=^\[\[package\]\]\s*$)')
            $identities = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            foreach ($block in $blocks) {
              $name = [regex]::Match($block, '(?m)^name = "([^"]+)"$')
              $version = [regex]::Match($block, '(?m)^version = "([^"]+)"$')
              $source = [regex]::Match($block, '(?m)^source = "([^"]+)"$')
              if ($name.Success -and $version.Success) {
                $sourceValue = if ($source.Success) { $source.Groups[1].Value } else { 'local' }
                [void]$identities.Add("$($name.Groups[1].Value)|$($version.Groups[1].Value)|$sourceValue")
              }
            }
            return ,$identities
          }
          $baseIdentities = Get-LockPackageIdentities (Join-Path $env:GITHUB_WORKSPACE 'Cargo.lock')
          $resolvedIdentities = Get-LockPackageIdentities $resolvedLock
          $removed = @()
          foreach ($identity in $baseIdentities) {
            if (-not $resolvedIdentities.Contains($identity)) { $removed += $identity }
          }
          if ($removed.Count -gt 0) { throw "Resolved lock removed base package identities: $($removed -join ', ')" }
          Write-Output 'Resolved Cargo.lock diff against the unchanged b9 baseline:'
          & git --no-pager diff --no-index --no-color --unified=3 -- (Join-Path $env:GITHUB_WORKSPACE 'Cargo.lock') $resolvedLock
          $diffExit = $LASTEXITCODE
          if ($diffExit -gt 1) { throw "Cargo.lock comparison failed with exit $diffExit" }
          $global:LASTEXITCODE = 0
          & cargo +1.100.0 run --manifest-path $manifestPath --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Pixmap/PNG API smoke failed with exit $LASTEXITCODE" }
          $artifactLock = Join-Path $env:RUNNER_TEMP 'lassoink-canonical-raster-Cargo.lock'
          if (Test-Path -LiteralPath $artifactLock) { throw 'Lock artifact path unexpectedly already exists.' }
          Copy-Item -LiteralPath $resolvedLock -Destination $artifactLock

      - name: Upload only the temporary resolved lockfile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lassoink-canonical-raster-Cargo-lock-${{ github.sha }}
          path: ${{ runner.temp }}\lassoink-canonical-raster-Cargo.lock
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify M5/M6 benchmark harness and default tests on Windows x64
    runs-on: windows-2025
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Check formatting
        shell: pwsh
        run: cargo +1.100.0 fmt --all -- --check

      - name: Run Clippy
        shell: pwsh
        run: cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        shell: pwsh
        run: cargo +1.100.0 test --locked --workspace

      - name: Build
        shell: pwsh
        run: cargo +1.100.0 build --locked --workspace

  native-ui:
    name: Guarded Windows and provider subprocess tests
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      LASSOINK_RUN_NATIVE_UI_TESTS: "1"
      LASSOINK_RUN_PROVIDER_MOCK_TESTS: "1"
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Run guarded native UI tests serially
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = "1.100.0"
          $env:RUSTC = "rustc"
          cargo +1.100.0 test --locked --workspace -- --include-ignored --test-threads=1

  raster-cpu-compatibility:
    name: Opt-in SenOCR full-precision CPU compatibility probe
    if: >-
      github.repository == 'Herzchens/LassoInk' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/raster-cpu-compatibility'
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 60
    concurrency:
      group: senocr-cpu-compatibility
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
    steps:
      - name: Guard hosted runner and explicit opt-in before checkout or network access
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
        run: |
          if ($env:EXPECTED_REPOSITORY -cne 'Herzchens/LassoInk') { throw 'Repository guard failed.' }
          if ($env:EXPECTED_EVENT -cne 'pull_request') { throw 'Pull request event is required.' }
          if ($env:CI -cne 'true' -or $env:GITHUB_ACTIONS -cne 'true') { throw 'Actions guard failed.' }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'Hosted Windows x64 guard failed.' }
          if ($env:LASSOINK_RUN_SENOCR_CPU_COMPAT -cne '1') { throw 'Explicit opt-in is required.' }
          if ($env:EXPECTED_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Exact head SHA is invalid.' }
          if ($env:EXPECTED_HEAD_REPOSITORY -cne 'Herzchens/LassoInk' -or $env:EXPECTED_HEAD_REF -cne 'test/raster-cpu-compatibility') { throw 'Pull request source guard failed.' }

      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out head SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Expected $env:EXPECTED_HEAD_SHA; got $actual"
          }

      - name: Set up pinned Python x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
          check-latest: false

      - name: Install pinned CPU runtime
        shell: pwsh
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_NO_CACHE_DIR: '1'
        run: |
          python -m pip install --quiet --disable-pip-version-check --no-cache-dir --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPU PyTorch installation failed.' }
          python -m pip install --quiet --disable-pip-version-check --no-cache-dir --only-binary=:all: --index-url https://pypi.org/simple 'transformers==5.23.0' 'Pillow==13.0.0' 'Jinja2==3.1.6'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Transformers/Pillow/template installation failed.' }

      - name: Run compatibility-only synthetic CPU probe
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          LASSOINK_RUN_SENOCR_CPU_COMPAT: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          TRANSFORMERS_VERBOSITY: error
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: python tests/fixtures/senocr_full_precision_cpu_compat.py
